<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Drop Game</title>
    <link rel="stylesheet" href="styles.css">
    <!-- I can't use the paid fonts provided because they are not available for free for personal use and I am not paying for them -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Raleway:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="game-wrapper">
        <h1 class="game-title">Water Drop</h1>
        <p class="game-tagline">Catch the good drops, avoid the bad ones!</p>
        <div class="score-panel">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="timer">Time: <span id="timer">30</span>s</div>
            <button id="start-btn">Start Game</button>
            <button id="reset-btn">Reset</button>
        </div>
        
        <div id="game-container">
          <div id="endMessage"></div>
    </div>

    <div class="game-footer">
        <img src="img/cw_logo-horizontal.png" alt="charity: water logo">
    </div>

  </div>
    
    <script src="script.js"></script>
</body>
</html>
